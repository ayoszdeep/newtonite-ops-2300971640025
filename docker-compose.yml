services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opsdesk
      POSTGRES_USER: opsdesk
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsdesk -d opsdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://opsdesk:local_dev_password@db:5432/opsdesk
      JWT_SECRET: 8b9925f95f840e0e57298be8d949af436951e7117b0296eaa8d36ba9f644c085
      JWT_EXPIRES_IN: 1h
      WEB_ORIGIN: http://localhost:5173
      OUTBOX_BATCH_SIZE: 10
      OUTBOX_MAX_ATTEMPTS: 5
      OUTBOX_POLL_INTERVAL_MS: 1000
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://opsdesk:local_dev_password@db:5432/opsdesk
      JWT_SECRET: 8b9925f95f840e0e57298be8d949af436951e7117b0296eaa8d36ba9f644c085
      OUTBOX_BATCH_SIZE: 10
      OUTBOX_MAX_ATTEMPTS: 5
      OUTBOX_POLL_INTERVAL_MS: 1000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
